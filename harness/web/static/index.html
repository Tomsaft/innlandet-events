<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Beveg: se hva som skjer i Innlandet, hvordan du kommer deg dit og hvordan været blir.">
  <title>Beveg</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-screen="home" data-sky="none" data-tod="day">
  <a class="skip" href="#screen" data-t="skip">Hopp til innholdet</a>

  <header class="topbar">
    <div class="topbar-row">
      <a class="wordmark" href="#/" aria-label="Beveg, til forsiden" data-ta="home_link">
        <svg class="mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
          <rect width="40" height="40" rx="12" class="mark-bg"/>
          <circle cx="27" cy="14" r="6" class="mark-sun"/>
          <path d="M0 27c7-6 13-6 20-1s13 5 20-1v15H0z" class="mark-hill"/>
          <path d="M5 33c4-2.5 8-2.5 12 0s8 2.5 12 0 6-2 9-1" class="mark-wave"/>
        </svg>
        <span class="wm-text" aria-hidden="true">Beve<span class="wm-g">g</span><span class="wm-dash"></span></span>
      </a>
      <div class="tools">
        <div id="lang" class="lang" role="group" aria-label="Språk" data-ta="lang_group">
          <button type="button" data-lang="no" lang="nb" aria-label="NO, norsk" aria-pressed="true">NO</button>
          <button type="button" data-lang="en" lang="en" aria-label="EN, English" aria-pressed="false">EN</button>
        </div>
        <button id="size" class="size-btn" type="button" aria-expanded="false" aria-controls="size-panel">
          <span class="size-aa" aria-hidden="true">A<small>a</small></span>
        </button>
      </div>
      <div id="size-panel" class="size-panel" hidden></div>
    </div>
    <p id="step" class="step"></p>
  </header>

  <main id="screen" tabindex="-1"></main>

  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="toast" class="toast" hidden></div>

  <nav class="bottombar" aria-label="Navigasjon" data-ta="bb_nav">
    <button id="bb-back" class="bb" type="button">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-back"/></svg>
      <span class="bb-label" data-t="bb_back">Tilbake</span>
    </button>
    <a id="bb-home" class="bb" href="#/">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-home"/></svg>
      <span class="bb-label" data-t="bb_home">Hjem</span>
    </a>
    <button id="bb-read" class="bb" type="button">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-speaker"/></svg>
      <span class="bb-label">Les høyt</span>
    </button>
  </nav>

  <!-- Home header scene: hills, Mjøsa, forest. Colours come from body[data-tod]. -->
  <template id="tpl-landscape">
    <svg class="land" viewBox="0 0 400 150" preserveAspectRatio="xMidYMax slice" focusable="false">
      <defs>
        <linearGradient id="land-sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color: var(--sky-top)"/>
          <stop offset="1" style="stop-color: var(--sky-bot)"/>
        </linearGradient>
      </defs>
      <rect width="400" height="150" fill="url(#land-sky)"/>
      <circle class="land-sun" cx="318" cy="52" r="17" style="fill: var(--sun)"/>
      <path style="fill: var(--hill-far)" d="M0 92C50 74 100 78 150 88s110-24 170-14 60 8 80 4v72H0z"/>
      <rect y="98" width="400" height="26" style="fill: var(--lake-c)"/>
      <path class="shimmer" style="stroke: var(--lake-hi)" fill="none" stroke-width="2" stroke-linecap="round"
            d="M150 106h34M206 112h46M282 105h22M190 118h28"/>
      <path style="fill: var(--hill-mid)" d="M0 110c40-10 90-8 140 4v36H0zM268 116c36-12 90-14 132-8v42H268z"/>
      <g style="fill: var(--tree)">
        <path d="M8 112l7-22 7 22zM20 111l8-26 8 26zM34 110l6-18 6 18zM44 110l8-24 8 24zM58 110l6-17 6 17zM68 111l7-21 7 21zM82 112l6-16 6 16zM92 113l7-19 7 19zM106 114l5-13 5 13z"/>
        <path d="M278 114l6-16 6 16zM290 112l7-21 7 21zM304 110l8-25 8 25zM318 109l6-18 6 18zM330 108l8-24 8 24zM344 108l6-17 6 17zM356 108l8-23 8 23zM370 108l6-16 6 16zM382 108l7-20 7 20z"/>
      </g>
      <path style="fill: var(--bg)" d="M0 134c70-14 150-8 220-2s130-6 180-4v22H0z"/>
    </svg>
  </template>

</html>
